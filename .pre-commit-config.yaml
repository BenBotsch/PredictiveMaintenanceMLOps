# Run `uv run pre-commit install` once (or `uvx pre-commit install`); CI runs the same checks.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # Generated figures stay as matplotlib writes them: its SVG path lines end with a space.
      - id: end-of-file-fixer
        exclude: ^docs/figures/.*\.svg$
      - id: trailing-whitespace
        exclude: ^docs/figures/.*\.svg$
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=500"]
  - repo: local
    hooks:
      # The project's own ruff and mypy, so the versions match uv.lock.
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
