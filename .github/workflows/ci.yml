name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest

  pipeline:
    # The whole path on the real data: download, train, export, container, request.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run pmm download
      - run: uv run pmm train
      - run: uv run pmm export
      - run: docker build -t pmm .
      - run: docker run -d --name pmm -p 8000:8000 pmm
      - name: Wait for the API
        run: |
          for _ in $(seq 30); do curl -sf http://127.0.0.1:8000/health && exit 0; sleep 1; done
          docker logs pmm; exit 1
      - name: Predict
        run: |
          curl -sf http://127.0.0.1:8000/predict -H 'Content-Type: application/json' -d '{"readings": [{"type": "L", "air_temp_k": 298.1, "process_temp_k": 308.6, "rotational_speed_rpm": 1551, "torque_nm": 42.8, "tool_wear_min": 0}]}' | tee prediction.json
          python3 -c "import json; p = json.load(open('prediction.json'))['predictions']; assert len(p) == 1"
